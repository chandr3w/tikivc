<!doctype html>
<html lang="en" data-mode="app">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Model enterprise-to-equity value and distribute M&A proceeds across security classes, preferences and consideration tranches.">
    <meta name="theme-color" content="#0a0a0c">
    <link rel="icon" href="./assets/atas-mark-white.png" type="image/png">
    <title>M&amp;A Proceeds Simulator | Atas VC</title>
    <link rel="stylesheet" href="./styles.css?v=11">
  </head>
  <body>
    <a class="skip-link" href="#results">skip to results</a>

    <div class="corner tl"><a href="https://atas.vc" aria-label="Atas VC home"><img src="./assets/atas-logo-white.png" alt="Atas VC" class="corner-logo"></a></div>
    <div class="corner bl">m&amp;a proceeds simulator</div>
    <div class="corner br"><span id="clock">00:00:00</span></div>

    <div class="app-shell">
      <header class="app-header">
        <div class="brand-lockup">
          <h1>M&amp;A Proceeds Simulator</h1>
        </div>
        <div class="header-tools" aria-label="Model actions">
          <label class="preset-control" for="preset-select"><span>scenario</span>
            <select id="preset-select">
              <option value="airtable">Airtable model</option>
              <option value="brex">Brex completed deal</option>
              <option value="clean">Clean acquisition</option>
              <option value="venture">Advanced venture sale</option>
            </select>
          </label>
          <button class="tool-button" id="reset-button" type="button">reset</button>
          <button class="tool-button" id="export-button" type="button">export</button>
          <button class="tool-button" id="import-button" type="button">import</button>
          <button class="tool-button" id="methods-button" type="button">methods</button>
          <button class="tool-button" id="sources-button" type="button">sources</button>
          <input id="import-file" type="file" accept="application/json" hidden>
        </div>
      </header>

      <main class="workspace">
        <aside class="control-panel" aria-label="Model inputs">
          <nav class="input-tabs" aria-label="Input sections">
            <button type="button" class="input-tab active" data-tab="deal">deal</button>
            <button type="button" class="input-tab" data-tab="stakeholders">securities</button>
            <button type="button" class="input-tab" data-tab="consideration">consideration</button>
            <button type="button" class="input-tab" data-tab="people">people</button>
          </nav>
          <div class="panel-scroll" id="controls"></div>
        </aside>

        <section id="results" class="results" tabindex="-1" aria-label="Waterfall results">
          <div id="results-content" aria-live="polite"></div>
        </section>
      </main>

      <footer class="mobile-footer">Illustrative modeling only. Confirm mechanics against transaction documents.</footer>
    </div>

    <dialog id="methods-dialog" class="modal">
      <form method="dialog" class="modal-frame">
        <header><div><span class="modal-kicker">calculation notes</span><h2>Methods &amp; mechanics</h2></div><button class="modal-close" aria-label="Close methods">×</button></header>
        <div id="methods-content" class="modal-content"></div>
      </form>
    </dialog>

    <dialog id="sources-dialog" class="modal">
      <form method="dialog" class="modal-frame">
        <header><div><span class="modal-kicker">research trail</span><h2>Sources &amp; assumptions</h2></div><button class="modal-close" aria-label="Close sources">×</button></header>
        <div id="sources-content" class="modal-content"></div>
      </form>
    </dialog>

    <div class="dot-cur" aria-hidden="true"></div>
    <script type="module" src="./app.js?v=12"></script>
  </body>
</html>
